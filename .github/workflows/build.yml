name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ModShardLauncher.Avalonia.slnx

      - name: Build
        run: dotnet build ModShardLauncher.Avalonia.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/ModShardLauncher.Tests/ModShardLauncher.Tests.csproj -c Release --no-build

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish GUI (self-contained, multi-file)
        run: >
          dotnet publish src/ModShardLauncher.GUI/ModShardLauncher.GUI.csproj
          -c Release -r win-x64 --self-contained true -o artifacts/app

      - name: Publish CLI (self-contained, multi-file)
        run: >
          dotnet publish src/ModShardLauncher.CLI/ModShardLauncher.CLI.csproj
          -c Release -r win-x64 --self-contained true -o artifacts/app

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        run: >
          .\scripts\build-installer.ps1 -SkipPublish -PublishDir artifacts/app
          -Output artifacts/ModShardLauncher-Setup-${{ github.ref_name }}.exe

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModShardLauncher-${{ github.ref_name }}-win-x64
          path: artifacts/app
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModShardLauncher-Setup-${{ github.ref_name }}
          path: artifacts/ModShardLauncher-Setup-${{ github.ref_name }}.exe
          if-no-files-found: error
